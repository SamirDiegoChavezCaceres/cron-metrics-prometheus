global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pushgateway
    # honor_labels keeps the `job` (and other) labels pushed by the scripts
    # instead of overwriting them with "pushgateway".
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
